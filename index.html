<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Application Policies & Legal Documentation</title>
  <style>
    :root {
      --bg: #0b0f19;
      --surface: #111827;
      --card: #1a2234;
      --border: #2d3748;
      --text: #f3f4f6;
      --text-muted: #9ca3af;
      --accent: #10b981;
      --accent-cyan: #06b6d4;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      line-height: 1.6;
      padding: 40px 20px;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
    }
    header {
      background: linear-gradient(135deg, #064e3b 0%, #0f172a 100%);
      border: 1px solid var(--accent);
      border-radius: 16px;
      padding: 32px;
      margin-bottom: 30px;
    }
    h1 { font-size: 2rem; margin-bottom: 8px; }
    p { color: var(--text-muted); font-size: 15px; }
    .policy-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .policy-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      text-decoration: none;
      color: var(--text);
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: all 0.2s ease;
    }
    .policy-card:hover {
      border-color: var(--accent-cyan);
      transform: translateY(-2px);
      box-shadow: 0 4px 20px rgba(6, 182, 212, 0.15);
    }
    .policy-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 4px;
    }
    .policy-meta {
      font-size: 13px;
      color: var(--text-muted);
    }
    .badge {
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid var(--accent);
      color: #34d399;
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 9999px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>App Privacy Policies</h1>
      <p>Official legal terms, privacy policies, and compliance documentation for published mobile applications.</p>
    </header>

    <div class="policy-list">
      <a class="policy-card" href="Loading-Background-Changer-For-ML/">
        <div>
          <div class="policy-title">Loading Changer for ML</div>
          <div class="policy-meta">Package ID: <code>com.chuchu.LoadingChangerBG</code> • Updated: Sept 2026</div>
        </div>
        <span class="badge">View Policy →</span>
      </a>
    </div>
  </div>
</body>
</html>
